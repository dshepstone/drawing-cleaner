name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest pyinstaller
      - name: Test
        run: python -m pytest -q tests
      - name: Build DrawingCleaner.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DrawingCleaner
          --icon assets/icon.ico
          --add-data "assets;assets"
          DrawingCleaner.py
      - name: Keep the .exe from this run
        uses: actions/upload-artifact@v4
        with:
          name: DrawingCleaner-windows
          path: dist/DrawingCleaner.exe
      - name: Attach the .exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DrawingCleaner.exe
          generate_release_notes: true
