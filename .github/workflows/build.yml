name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest pyinstaller
      - name: Test
        run: python -m pytest -q tests
      - name: Build DrawingCleaner.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DrawingCleaner
          --icon assets/icon.ico
          --add-data "assets;assets"
          DrawingCleaner.py
      - name: Package the download as a zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/DrawingCleaner | Out-Null
          Copy-Item dist/DrawingCleaner.exe package/DrawingCleaner/
          Copy-Item "packaging/READ ME FIRST.txt" package/DrawingCleaner/
          Compress-Archive -Path package/DrawingCleaner -DestinationPath DrawingCleaner-Windows.zip -Force
      - name: Keep the zip from this run
        uses: actions/upload-artifact@v4
        with:
          name: DrawingCleaner-Windows
          path: package/DrawingCleaner
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DrawingCleaner-Windows.zip
          generate_release_notes: true
